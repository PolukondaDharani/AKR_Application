<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gate Ticket Scanner | Home Entertainments</title>
    <!-- html5-qrcode camera scanner library -->
    <script src="https://unpkg.com/html5-qrcode"></script>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background-color: #0d0d0d;
            color: #f5f5f5;
            margin: 0;
            padding: 20px;
            text-align: center;
        }
        .scanner-container {
            max-width: 480px;
            margin: 0 auto;
            background: #181818;
            border: 1px solid rgba(212,175,55,0.2);
            border-radius: 16px;
            padding: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.6);
        }
        h2 {
            color: #d4af37;
            margin-top: 10px;
            font-size: 22px;
        }
        #reader {
            width: 100%;
            border-radius: 10px;
            overflow: hidden;
            border: 2px solid #333;
            background: #000;
        }
        .result-box {
            margin-top: 20px;
            padding: 20px;
            border-radius: 10px;
            font-size: 18px;
            font-weight: 700;
            display: none;
            line-height: 1.5;
        }
        .success {
            background-color: rgba(6, 95, 70, 0.85);
            color: #6ee7b7;
            border: 1px solid #059669;
        }
        .error {
            background-color: rgba(153, 27, 27, 0.85);
            color: #fca5a5;
            border: 1px solid #dc2626;
        }
        .back-link {
            display: inline-block;
            margin-top: 20px;
            color: #d4af37;
            text-decoration: none;
            font-size: 14px;
        }
        .back-link:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>

    <div class="scanner-container">
        <h2>🎟️ Gate Entrance Scanner</h2>
        <p style="color: #aaa; font-size: 13px; margin-bottom: 20px;">Point camera at attendee's QR code pass</p>
        
        <div id="reader"></div>
        <div id="result" class="result-box"></div>

        <a href="{{ url_for('booking_admin') }}" class="back-link">&larr; Back to Admin Dashboard</a>
    </div>

    <script>
        let isScanning = true;
        const html5QrcodeScanner = new Html5QrcodeScanner(
            "reader", 
            { 
                fps: 10, 
                qrbox: { width: 250, height: 250 } 
            }, 
            false
        );

        function onScanSuccess(decodedText, decodedResult) {
            if (!isScanning) return;
            isScanning = false;
            
            // Temporarily pause scanner UI
            html5QrcodeScanner.pause();

            fetch('/admin/scanner/verify', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ qr_token: decodedText })
            })
            .then(response => response.json().then(data => ({ status: response.status, body: data })))
            .then(res => {
                const resultDiv = document.getElementById('result');
                resultDiv.style.display = 'block';
                
                if (res.status === 200) {
                    resultDiv.className = 'result-box success';
                    resultDiv.innerHTML = `${res.body.message}<br><small style="font-size:14px;font-weight:normal;color:#fff;">${res.body.customer_name} (${res.body.quantity} Tickets) - ${res.body.show_title}</small>`;
                } else {
                    resultDiv.className = 'result-box error';
                    resultDiv.innerHTML = `${res.body.message}`;
                }

                // Resume scanning after 3 seconds
                setTimeout(() => {
                    resultDiv.style.display = 'none';
                    isScanning = true;
                    html5QrcodeScanner.resume();
                }, 3000);
            })
            .catch(err => {
                console.error(err);
                const resultDiv = document.getElementById('result');
                resultDiv.style.display = 'block';
                resultDiv.className = 'result-box error';
                resultDiv.innerHTML = "❌ Network error verifying ticket.";
                
                setTimeout(() => {
                    resultDiv.style.display = 'none';
                    isScanning = true;
                    html5QrcodeScanner.resume();
                }, 3000);
            });
        }

        html5QrcodeScanner.render(onScanSuccess);
    </script>
</body>
</html>
