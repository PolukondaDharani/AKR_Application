{% extends "base.html" %}
{% block content %}

<style>
  /* ---------- BACKGROUND ---------- */
  body {
    margin: 0;
    /* Deep cinematic black background */
    background: radial-gradient(circle at center, #1a1a1a 0%, #000000 100%);
    color: #fff;
    overflow-x: hidden;
  }

  /* Floating gold particle dots */
  .particles {
    position: fixed;
    top: 0; left: 0;
    width: 100%; height: 100%;
    overflow: hidden;
    pointer-events: none;
    z-index: 0;
  }
  .particles span {
    position: absolute;
    display: block;
    width: 4px; height: 4px;
    background: rgba(212, 175, 55, 0.3); /* Muted gold particles */
    border-radius: 50%;
    animation: floatParticle 10s linear infinite;
  }
  @keyframes floatParticle {
    0% { transform: translateY(0) scale(1); opacity: 1; }
    100% { transform: translateY(-100vh) scale(0); opacity: 0; }
  }

  /* ---------- CARD STYLING ---------- */
  .join-container {
    /* Increased gap between header and form */
    margin-top: 150px; 
    position: relative;
    z-index: 2;
    padding-bottom: 80px;
  }

  .join-card {
    position: relative;
    background: #0a0a0a; /* True black card */
    border-radius: 30px;
    padding: 60px 45px;
    /* Subtle gold border glow */
    border: 1px solid rgba(212, 175, 55, 0.2);
    box-shadow: 0 15px 50px rgba(0,0,0,0.8);
    animation: fadeInUp 1.2s ease;
  }

  @keyframes fadeInUp {
    0% { opacity: 0; transform: translateY(40px); }
    100% { opacity: 1; transform: translateY(0); }
  }

  /* ---------- GOLD GRADIENT TEXT ---------- */
  .gold-text {
    background: linear-gradient(90deg, #d4af37, #f1d592, #b8860b);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    font-weight: 800;
    text-align: center;
    text-transform: uppercase;
    letter-spacing: 2px;
    margin-bottom: 10px;
  }

  .join-card p {
    color: #999;
    text-align: center;
    font-size: 1rem;
    margin-bottom: 40px;
  }

  /* ---------- FORM STYLING ---------- */
  .form-label {
    color: #d4af37; /* Gold labels */
    font-weight: 600;
    font-size: 0.85rem;
    text-transform: uppercase;
    letter-spacing: 1px;
    margin-bottom: 8px;
  }

  .form-control {
    background: #111;
    border: 1px solid #333;
    color: #fff;
    border-radius: 8px;
    padding: 12px;
    transition: 0.3s ease;
  }

  .form-control:focus {
    background: #151515;
    border-color: #d4af37;
    box-shadow: 0 0 10px rgba(212, 175, 55, 0.2);
    outline: none;
    color: #fff;
  }

  /* ---------- GOLD GRADIENT BUTTON ---------- */
  .btn-submit {
    background: linear-gradient(45deg, #b8860b, #d4af37, #f1d592);
    border: none;
    color: #000;
    font-weight: 800;
    text-transform: uppercase;
    letter-spacing: 1px;
    border-radius: 50px; /* Pill shape to match your 'Watch' button */
    padding: 15px 30px;
    width: 100%;
    transition: 0.4s ease;
    cursor: pointer;
  }

  .btn-submit:hover {
    box-shadow: 0 0 30px rgba(212, 175, 55, 0.5);
    transform: scale(1.02);
  }

  /* ---------- MOBILE OPTIMIZATION ---------- */
  @media (max-width: 768px) {
    .join-container {
      margin-top: 30px; /* Slightly less on mobile but still a healthy gap */
    }
    .join-card {
      padding: 40px 20px;
      margin: 0 15px;
    }
    .gold-text {
      font-size: 1.5rem;
    }
    .btn-submit {
        font-size: 0.9rem;
        padding: 12px;
    }
  }
</style>

<div class="particles">
  {% for i in range(20) %}
  <span style="left:{{ loop.index * 5 }}%; top:{{ loop.index * 4 }}%; animation-delay:{{ loop.index * 0.4 }}s;"></span>
  {% endfor %}
</div>

<div class="join-container container py-5 d-flex justify-content-center align-items-center min-vh-100">
  <div class="join-card w-100" style="max-width: 750px;">
    <h3 class="gold-text">Join Our Team</h3>
    <p>Fuel our vision with your passion. We are scouting for the boldest storytellers.</p>

    <form action="{{ url_for('join') }}" method="POST" enctype="multipart/form-data" class="row g-4">
      <div class="col-md-6">
        <label class="form-label">Full Name</label>
        <input type="text" name="name" class="form-control" placeholder="Your Name" required>
      </div>
      <div class="col-md-6">
        <label class="form-label">Email Address</label>
        <input type="email" name="email" class="form-control" placeholder="email@example.com" required>
      </div>
      <div class="col-md-6">
        <label class="form-label">Area of Interest</label>
        <input type="text" name="interest" class="form-control" placeholder="e.g. Editing, Acting" required>
      </div>
      <div class="col-md-6">
        <label class="form-label">Portfolio Link</label>
        <input type="text" name="portfolio" class="form-control" placeholder="Behance, LinkedIn, etc.">
      </div>
      <div class="col-md-12">
        <label class="form-label">Attach CV (PDF/DOC)</label>
        <input type="file" name="resume" class="form-control">
      </div>
      <div class="col-12 mt-5">
        <button type="submit" class="btn-submit">Submit Application</button>
      </div>
    </form>
  </div>
</div>

{% endblock %}
