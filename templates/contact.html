{% extends "base.html" %}
{% block content %}

<style>
  /* ---------- BACKGROUND ---------- */
  body {
    margin: 0;
    background: radial-gradient(circle at center, #141414 0%, #000000 100%);
    color: #fff;
    overflow-x: hidden;
  }

  /* Cinematic light sweep effect */
  .contact-container {
    margin-top: 140px; /* Increased gap from header */
    position: relative;
    z-index: 2;
    padding-bottom: 60px;
  }

  /* ---------- GOLD CONTACT CARD ---------- */
  .contact-card {
    position: relative;
    background: rgba(10, 10, 10, 0.9);
    backdrop-filter: blur(20px);
    border-radius: 30px;
    padding: 60px 45px;
    border: 1px solid rgba(212, 175, 55, 0.15); /* Soft Gold Border */
    box-shadow: 0 20px 50px rgba(0,0,0,0.9);
    animation: fadeInUp 1.2s ease;
  }

  @keyframes fadeInUp {
    0% { opacity: 0; transform: translateY(30px); }
    100% { opacity: 1; transform: translateY(0); }
  }

  /* Gold Gradient Heading */
  .gold-heading {
    background: linear-gradient(90deg, #d4af37, #f1d592, #b8860b);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    font-weight: 800;
    text-transform: uppercase;
    letter-spacing: 2px;
    font-size: 1.8rem;
    white-space: nowrap;
  }

  /* Icons with Glow */
  .contact-info p {
    color: #999;
    font-size: 0.95rem;
    transition: 0.3s;
  }

  .contact-info i {
    color: #d4af37; /* Gold Icons */
    margin-right: 15px;
    text-shadow: 0 0 10px rgba(212, 175, 55, 0.4);
  }

  /* Social Links */
  .social-links a {
    color: #d4af37;
    transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
  }

  .social-links a:hover {
    color: #fff;
    transform: translateY(-5px);
    text-shadow: 0 0 15px rgba(212, 175, 55, 0.8);
  }

  /* ---------- FORM ELEMENTS ---------- */
  .contact-form input,
  .contact-form textarea {
    background: #050505;
    border: 1px solid #222;
    color: #fff;
    border-radius: 12px;
    font-size: 0.95rem;
    padding: 15px;
    transition: 0.4s ease;
  }

  .contact-form input:focus,
  .contact-form textarea:focus {
    background: #0a0a0a;
    border-color: #d4af37;
    box-shadow: 0 0 15px rgba(212, 175, 55, 0.1);
    outline: none;
  }

  /* Gold Pill Button */
  .btn-gold {
    background: linear-gradient(45deg, #b8860b, #d4af37, #f1d592);
    border: none;
    color: #000;
    font-weight: 800;
    text-transform: uppercase;
    letter-spacing: 1px;
    border-radius: 50px;
    padding: 15px;
    transition: 0.4s ease;
    margin-top: 10px;
  }

  .btn-gold:hover {
    box-shadow: 0 0 30px rgba(212, 175, 55, 0.4);
    transform: scale(1.03);
    color: #000;
  }

  /* ---------- MOBILE ---------- */
  @media (max-width: 768px) {
    .contact-container { margin-top: 50px; }
    .contact-card { padding: 40px 25px; margin: 0 15px; }
    .gold-heading { font-size: 1.4rem; }
  }
</style>

<div class="contact-container container d-flex justify-content-center align-items-center">
  <div class="contact-card text-white" style="max-width: 550px; width: 100%;">
    <h2 class="gold-heading text-center mb-4">Get In Touch</h2>
    
    <div class="contact-info mb-5">
      <div class="d-flex flex-column align-items-center gap-2">
        <p><i class="bi bi-telephone-fill"></i> +1 234 567 8901</p>
        <p><i class="bi bi-envelope-fill"></i> info@akr.com</p>
        <p><i class="bi bi-geo-alt-fill"></i> 123 Main Street, City, Country</p>
      </div>

      <div class="social-links d-flex justify-content-center gap-4 mt-4">
        <a href="#"><i class="bi bi-linkedin fs-4"></i></a>
        <a href="#"><i class="bi bi-instagram fs-4"></i></a>
        <a href="#"><i class="bi bi-twitter-x fs-4"></i></a>
      </div>
    </div>

    <form class="contact-form" method="POST" action="{{ url_for('contact') }}">
      <div class="mb-3">
        <input type="text" name="name" class="form-control" placeholder="YOUR NAME" required>
      </div>
      <div class="mb-3">
        <input type="email" name="email" class="form-control" placeholder="EMAIL ADDRESS" required>
      </div>
      <div class="mb-4">
        <textarea name="message" class="form-control" rows="4" placeholder="HOW CAN WE COLLABORATE?" required></textarea>
      </div>
      <button type="submit" class="btn btn-gold w-100">Send Message</button>
    </form>
  </div>
</div>

<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">

{% endblock %}
